name: tests
on: [push, pull_request]
jobs:
  host-tests:
    # Pinned to the image the suite is known to pass on (ubuntu-latest is moving to Ubuntu 26).
    runs-on: ubuntu-24.04
    env:
      MO_SYNTHETIC: "1"
      # No apt or needrestart prompt may wait for input.
      DEBIAN_FRONTEND: noninteractive
      NEEDRESTART_MODE: a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Ubuntu's default awk (mawk) buffers input from pipes; the car runs BusyBox awk, so the tests use gawk.
      # gawk and xvfb are on the runner image; apt is only used when one is missing, so a mirror outage cannot stop
      # the suite (on 11 Nov 2026 the runners could not resolve the Ubuntu mirror for hours).
      - run: command -v gawk || { sudo apt-get update && sudo apt-get install -y gawk; }
      - run: python dump-stick/tests/test_dump_stick.py
      - run: python collector/tests/test_collector.py
      - run: python collector/tests/test_calibrate.py
      - run: python dev/tests/test_dev.py
      - run: python tools/tests/test_check_dump.py
      - run: python tools/tests/test_stickkit.py
      - run: python tools/tests/test_drives.py
      - run: python tools/tests/test_stickflow.py
      - run: python tools/tests/test_stickwriter.py
      - run: node meters-app/tests/test_meters_app.js
      # Meters Designer and custom pages. The PNG-baseline browser specs stay local: font rendering differs on Linux.
      - run: npm ci
        working-directory: meters/tests/v3
      - run: node --test meters/tests/v3/*.test.mjs
      - run: python tools/tests/test_custom_pages_build.py
      - run: python tools/tests/test_home_menu.py
      - run: command -v xvfb-run || { sudo apt-get update && sudo apt-get install -y xvfb; }
      - run: xvfb-run -a python tools/tests/test_meters_library.py
      # Only the browser, from Playwright's own server: the runner image already has Chromium's libraries, and
      # "--with-deps" only added extra fonts from the Ubuntu mirror that the pages (with their own fonts) do not use.
      # On failure the end of the log becomes an annotation, which is readable without signing in.
      - name: Chromium browser
        working-directory: meters/tests/v3
        run: |
          set +e
          timeout 480 npx playwright install chromium > browser.log 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then python3 ../../../tools/ci_annotation.py browser.log "Playwright browser download failed (exit $rc)"; fi
          exit $rc
      - run: npx playwright test car-parity car-app collector-dev
        working-directory: meters/tests/v3
      - name: Shared Designer and Mazda Home browser tests
        run: npx playwright test --config=home-ci.config.mjs
        working-directory: meters/tests/v3
      - name: Pull the BusyBox image the AA-touch suite runs in
        run: docker pull busybox:1.25
      - name: Synthetic development harness under BusyBox
        run: MO_DOCKER_IMAGE=busybox:1.25 python dev/tests/test_dev.py
      # The AA-touch suite includes the Meters scenarios, which need real symlinks and BusyBox.
      # On failure its last lines are also shown as an annotation, which is readable without signing in.
      - name: AA-touch suite under BusyBox
        run: |
          set +e
          MO_DOCKER_IMAGE=busybox:1.25 python aa-touch-stick/tests/test_aa_touch_stick.py > aa-touch.log 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            python3 tools/ci_annotation.py aa-touch.log "AA-touch suite failed (exit $rc)"
          fi
          exit $rc
