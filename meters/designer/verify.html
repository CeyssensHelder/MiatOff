<!doctype html><meta charset="utf-8"><title>Studio renderer verification</title><pre id="results">Running…</pre><canvas id="test" width="800" height="480"></canvas><script src="../js/designer-runtime.js"></script><script src="signals.js"></script><script src="model.js"></script><script src="assets.js"></script><script src="render.js"></script><script>
(async()=>{try{const M=StudioModel,s=M.defaults(),t=M.starter('Neon'),c=document.getElementById('test'),ctx=c.getContext('2d'),state={rpm:5000,speed:100,vehicle:s.vehicle,history:[],time:0};let count=0;for(const [type,def]of Object.entries(M.registry))for(const variant of def.variants){const w=M.widget(type,variant);for(const rpm of [0,3500,8000]){state.rpm=rpm;StudioRender.draw(ctx,t,{widgets:[w]}, {},state);count++;}}const blob=await new Promise(r=>c.toBlob(r,'image/png'));const asset=await StudioAssets.image(new File([blob],'synthetic.png',{type:'image/png'}));s.themes=[t];s.assets={sample:asset};t.background.kind='image';t.background.asset='sample';M.validate(s);const roundtrip=JSON.parse(JSON.stringify(s));M.validate(roundtrip);const widgets=Array.from({length:24},(_,i)=>Object.assign(M.widget('radial'),{x:i%6*128,y:Math.floor(i/6)*112,w:128,h:112,size:18}));const start=performance.now();for(let i=0;i<120;i++)StudioRender.draw(ctx,t,{widgets},s.assets,state);const ms=(performance.now()-start)/120;document.getElementById('results').textContent='PASS '+count+' variant/boundary renders\nPASS synthetic image normalization and JSON asset roundtrip\n24-widget render mean: '+ms.toFixed(2)+' ms\nBackground cache entries: '+StudioRender.cacheSize();}catch(e){document.getElementById('results').textContent='FAIL '+e.stack;}})();</script>
