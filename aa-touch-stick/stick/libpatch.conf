# libpatch.conf for oem-aa-mod 0.10.0, written by the MiatOff AA-touch kit.
#
# Only the touch shim is wanted. Every other key is set explicitly, because a
# missing key falls back to the built-in default, and some defaults are "true"
# (hud, mute_pauses_phone, hud_fold_latin).
# See the release's resources/libpatch.conf for what each key does.

touch = true

hud = false
hud_transport = svcnavi
hud_fold_latin = false
mute_pauses_phone = false
unmute_starts_playback = false
block_headunit_media_play = false
bt_pairing_bypass_all_devices = false
bt_pairing_show_device_notification = false
force_street_name = false
use_protocol_v1_6 = false
aa_audio_low_latency = false
